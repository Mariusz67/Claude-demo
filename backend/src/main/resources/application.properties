# Server Configuration
server.port=${PORT:8081}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database initialization 
spring.sql.init.mode=always

# Logging
logging.level.org.springframework.jdbc.core=DEBUG

# JWT
jwt.secret=${JWT_SECRET}

# Mail (Resend via SMTP)
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
mail.from=${MAIL_FROM:onboarding@resend.dev}


