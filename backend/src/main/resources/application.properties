# Server Configuration
server.port=${PORT:8081}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database initialization 
spring.sql.init.mode=always

# Logging
logging.level.org.springframework.jdbc.core=DEBUG

# JWT
jwt.secret=${JWT_SECRET}

# Mail (Resend via HTTP API - avoids SMTP port blocking on Railway)
resend.api.key=${RESEND_API_KEY:}
mail.from=${MAIL_FROM:reminder@memobee.eu}

# Frontend URL (for password reset links)
app.frontend.url=${FRONTEND_URL:http://localhost:8000}


