# Test Configuration — overrides main application.properties for CI/test runs
# No real database needed: all repositories are mocked via @MockitoBean

# Disable datasource auto-configuration (no PostgreSQL required)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# Disable SQL init
spring.sql.init.mode=never

# JWT secret for tests
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256!!

# Mail — not used in tests
resend.api.key=
mail.from=test@example.com

# Frontend URL
app.frontend.url=http://localhost:8000
