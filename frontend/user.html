<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        h1 {
            color: #333;
            font-size: 1.8rem;
        }

        .user-name {
            color: var(--primary-dark);
            font-weight: bold;
        }

        .logout-btn {
            font-size: 0.9rem;
        }

        /* Form styles */
        .note-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .note-form h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        /* Type tiles */
        .type-tiles {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .type-tile {
            flex: 1;
            padding: 18px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: white;
            user-select: none;
        }

        .type-tile:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
        }

        .type-tile.active-memo {
            border-color: #28a745;
            background: #e8f5e9;
        }

        .type-tile.active-reminder {
            border-color: #ffc107;
            background: #fff8e1;
        }

        .tile-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .tile-label {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        /* Type-specific fields */
        .type-fields {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .type-fields.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group label {
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group.full-width {
            flex-basis: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-end;
            padding-bottom: 4px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .checkbox-group input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #ffc107;
        }

        .repeat-interval {
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .repeat-interval.visible {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Custom datetime picker */
        .datetime-picker {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .datetime-picker input[type="date"] {
            flex: 1;
            min-width: 150px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .time-picker {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .time-picker select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            appearance: auto;
        }

        .time-picker .separator {
            font-weight: bold;
            font-size: 1.1rem;
            color: #555;
        }

        .btn {
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* Notes list styles */
        .notes-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .notes-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--primary);
        }

        .note-card.type-note {
            border-left-color: var(--primary);
        }

        .note-card.type-memo {
            border-left-color: #28a745;
        }

        .note-card.type-reminder {
            border-left-color: #ffc107;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .note-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .note-type {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .note-type.type-note {
            background: #e8eaf6;
            color: var(--primary);
        }

        .note-type.type-memo {
            background: #e8f5e9;
            color: #28a745;
        }

        .note-type.type-reminder {
            background: #fff8e1;
            color: #ff8f00;
        }

        .note-frequency,
        .note-date {
            font-size: 0.75rem;
            color: #888;
        }

        .note-actions {
            display: flex;
            gap: 5px;
        }

        .note-text {
            color: #333;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-attachment {
            margin-top: 10px;
            padding: 8px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 0.85rem;
            color: #555;
        }

        .empty-message {
            text-align: center;
            color: #888;
            padding: 40px;
            font-style: italic;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>User board of <span class="user-name" id="userName">User</span></h1>
            <button class="btn logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="message" class="message"></div>

        <!-- Note Form -->
        <div class="note-form">
            <h2 id="formTitle">Add New Note</h2>
            <input type="hidden" id="noteId">
            <input type="hidden" id="noteType">

            <!-- Type selection tiles -->
            <div class="type-tiles" id="typeTiles">
                <div class="type-tile" id="tile-memo" onclick="selectType('memo')">
                    <div class="tile-icon">📝</div>
                    <div class="tile-label">Memo</div>
                </div>
                <div class="type-tile" id="tile-reminder" onclick="selectType('reminder')">
                    <div class="tile-icon">🔔</div>
                    <div class="tile-label">Reminder</div>
                </div>
            </div>

            <!-- Memo fields -->
            <div class="type-fields" id="memoFields">
                <div class="form-row">
                    <div class="form-group">
                        <label for="noteFrequency">Frequency</label>
                        <select id="noteFrequency">
                            <option value="never">Never</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="quarterly">Quarterly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="memoText">Text (max 10000 characters)</label>
                        <textarea id="memoText" maxlength="10000" placeholder="Enter your memo text..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Reminder fields -->
            <div class="type-fields" id="reminderFields">
                <div class="form-row">
                    <div class="form-group">
                        <label>Reminder date &amp; time</label>
                        <div class="datetime-picker">
                            <input type="date" id="reminderDate">
                            <div class="time-picker">
                                <select id="reminderHour"></select>
                                <span class="separator">:</span>
                                <select id="reminderMinute"></select>
                            </div>
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="repeatUntilDeleted" onchange="toggleRepeatInterval()"> Repeat
                        </label>
                    </div>
                </div>
                <div class="repeat-interval" id="repeatInterval">
                    <div class="form-group">
                        <label for="repeatDays">Days</label>
                        <input type="number" id="repeatDays" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label for="repeatHours">Hours</label>
                        <input type="number" id="repeatHours" value="0" min="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="reminderText">Text (max 10000 characters)</label>
                        <textarea id="reminderText" maxlength="10000" placeholder="Enter your reminder text..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-buttons" id="formButtons" style="display:none;">
                <button class="btn btn-primary" onclick="saveNote()">Save</button>
                <button class="btn btn-secondary" onclick="clearForm()" id="cancelBtn">Cancel</button>
            </div>
        </div>

        <!-- Notes List -->
        <div class="notes-section">
            <h2>My Notes</h2>
            <div class="notes-filter">
                <button class="filter-btn active" onclick="filterNotes('all', event)">All</button>
                <button class="filter-btn" onclick="filterNotes('memo', event)">Memos</button>
                <button class="filter-btn" onclick="filterNotes('reminder', event)">Reminders</button>
            </div>
            <div class="notes-list" id="notesList">
                <div class="empty-message">Loading notes...</div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8081'
            : 'https://pretty-illumination-production.up.railway.app';

        const NOTES_URL = BASE_URL + '/api/notes';

        let userEmail = '';
        let allNotes = [];
        let currentFilter = 'all';

        function authHeaders() {
            return { 'Authorization': 'Bearer ' + sessionStorage.getItem('token') };
        }

        if (!sessionStorage.getItem('loggedIn') || sessionStorage.getItem('userRole') !== 'user') {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        userEmail = sessionStorage.getItem('userEmail');
        const userName = sessionStorage.getItem('userName');
        if (userName) {
            document.getElementById('userName').textContent = userName;
        }

        // Populate hour/minute dropdowns
        (function initTimePickers() {
            const hourSel = document.getElementById('reminderHour');
            const minSel  = document.getElementById('reminderMinute');
            for (let h = 0; h < 24; h++) {
                const opt = document.createElement('option');
                opt.value = String(h).padStart(2, '0');
                opt.textContent = String(h).padStart(2, '0');
                hourSel.appendChild(opt);
            }
            for (let m = 0; m < 60; m++) {
                const opt = document.createElement('option');
                opt.value = String(m).padStart(2, '0');
                opt.textContent = String(m).padStart(2, '0');
                minSel.appendChild(opt);
            }
            // Default: tomorrow at 08:00
            setDefaultReminderDateTime();
        })();

        function setDefaultReminderDateTime() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            document.getElementById('reminderDate').value = `${y}-${m}-${d}`;
            document.getElementById('reminderHour').value = '08';
            document.getElementById('reminderMinute').value = '00';
        }

        loadNotes();

        function selectType(type) {
            document.getElementById('noteType').value = type;

            document.querySelectorAll('.type-tile').forEach(t => {
                t.classList.remove('active-memo', 'active-reminder');
            });
            document.getElementById('tile-' + type).classList.add('active-' + type);

            document.getElementById('memoFields').classList.toggle('visible', type === 'memo');
            document.getElementById('reminderFields').classList.toggle('visible', type === 'reminder');
            document.getElementById('formButtons').style.display = 'flex';
        }

        function toggleRepeatInterval() {
            const checked = document.getElementById('repeatUntilDeleted').checked;
            document.getElementById('repeatInterval').classList.toggle('visible', checked);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        async function loadNotes() {
            try {
                const response = await fetch(`${NOTES_URL}/user/${encodeURIComponent(userEmail)}`, { headers: authHeaders() });
                if (response.ok) {
                    allNotes = await response.json();
                    renderNotes();
                } else {
                    showMessage('Failed to load notes', 'error');
                }
            } catch (error) {
                showMessage('Cannot connect to server', 'error');
            }
        }

        function renderNotes() {
            const notesList = document.getElementById('notesList');
            let filteredNotes = allNotes;

            if (currentFilter !== 'all') {
                filteredNotes = allNotes.filter(n => n.type === currentFilter);
            }

            if (filteredNotes.length === 0) {
                notesList.innerHTML = '<div class="empty-message">No notes found. Create your first note above!</div>';
                return;
            }

            filteredNotes.sort((a, b) => {
                if (!a.createdAt) return 1;
                if (!b.createdAt) return -1;
                return b.createdAt.localeCompare(a.createdAt);
            });

            notesList.innerHTML = filteredNotes.map(note => {
                let metaExtra = '';
                if (note.type === 'memo' && note.frequency && note.frequency !== 'never') {
                    metaExtra = `<span class="note-frequency">${note.frequency}</span>`;
                } else if (note.type === 'reminder') {
                    if (note.reminderAt) {
                        metaExtra += `<span class="note-frequency">at ${formatDate(note.reminderAt)}</span>`;
                    }
                    if (note.repeatUntilDeleted) {
                        const parts = [];
                        if (note.repeatDays)  parts.push(`${note.repeatDays}d`);
                        if (note.repeatHours) parts.push(`${note.repeatHours}h`);
                        if (note.repeatQuarters) parts.push(`${note.repeatQuarters}q`);
                        metaExtra += `<span class="note-frequency">repeats every ${parts.length ? parts.join(' ') : '—'}</span>`;
                    }
                }
                return `
                <div class="note-card type-${note.type}">
                    <div class="note-header">
                        <div class="note-meta">
                            <span class="note-type type-${note.type}">${note.type}</span>
                            ${metaExtra}
                            <span class="note-date">${formatDate(note.createdAt)}</span>
                        </div>
                        <div class="note-actions">
                            <button class="btn btn-secondary btn-small" onclick="editNote(${note.id})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteNote(${note.id})">Delete</button>
                        </div>
                    </div>
                    <div class="note-text">${escapeHtml(note.text || '')}</div>
                    ${note.attachmentName ? `<div class="note-attachment">Attachment: ${escapeHtml(note.attachmentName)}</div>` : ''}
                </div>`;
            }).join('');
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const normalized = /Z|[+-]\d{2}:\d{2}$/.test(dateStr) ? dateStr : dateStr + 'Z';
                const date = new Date(normalized);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch {
                return dateStr;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterNotes(type, event) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderNotes();
        }

        // Build a local Date from the date/hour/minute pickers, then return UTC ISO string (no trailing Z)
        function getPickerAsUTC() {
            const dateVal = document.getElementById('reminderDate').value;
            const hour    = document.getElementById('reminderHour').value;
            const minute  = document.getElementById('reminderMinute').value;
            if (!dateVal) return null;
            const local = new Date(`${dateVal}T${hour}:${minute}:00`);
            return local.toISOString().slice(0, 19);
        }

        // Set the date/hour/minute pickers from a UTC datetime string
        function setPickerFromUTC(utcStr) {
            if (!utcStr) { setDefaultReminderDateTime(); return; }
            const normalized = /Z|[+-]\d{2}:\d{2}$/.test(utcStr) ? utcStr : utcStr + 'Z';
            const d = new Date(normalized);
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('reminderDate').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
            document.getElementById('reminderHour').value = pad(d.getHours());
            document.getElementById('reminderMinute').value = pad(d.getMinutes());
        }

        async function saveNote() {
            const noteId = document.getElementById('noteId').value;
            const type = document.getElementById('noteType').value;

            if (!type) {
                showMessage('Please select a type', 'error');
                return;
            }

            const text = type === 'memo'
                ? document.getElementById('memoText').value
                : document.getElementById('reminderText').value;

            if (!text.trim()) {
                showMessage('Please enter text', 'error');
                return;
            }

            const noteData = { userEmail, type, text };

            if (type === 'memo') {
                noteData.frequency = document.getElementById('noteFrequency').value;
            } else if (type === 'reminder') {
                noteData.frequency = 'never';
                noteData.reminderAt = getPickerAsUTC();
                noteData.repeatUntilDeleted = document.getElementById('repeatUntilDeleted').checked;
                noteData.repeatDays = parseInt(document.getElementById('repeatDays').value) || 0;
                noteData.repeatHours = parseInt(document.getElementById('repeatHours').value) || 0;
                noteData.repeatQuarters = 0;
            }

            try {
                const response = await fetch(
                    noteId ? `${NOTES_URL}/${noteId}` : NOTES_URL,
                    {
                        method: noteId ? 'PUT' : 'POST',
                        headers: { 'Content-Type': 'application/json', ...authHeaders() },
                        body: JSON.stringify(noteData)
                    }
                );

                if (response.ok) {
                    showMessage(noteId ? 'Note updated successfully' : 'Note created successfully', 'success');
                    clearForm();
                    loadNotes();
                } else {
                    showMessage('Failed to save note', 'error');
                }
            } catch (error) {
                showMessage('Cannot connect to server', 'error');
            }
        }

        function editNote(id) {
            const note = allNotes.find(n => n.id === id);
            if (!note) return;

            const type = note.type === 'note' ? 'memo' : note.type;

            document.getElementById('noteId').value = note.id;
            selectType(type);

            if (type === 'memo') {
                document.getElementById('noteFrequency').value = note.frequency || 'never';
                document.getElementById('memoText').value = note.text || '';
            } else if (type === 'reminder') {
                setPickerFromUTC(note.reminderAt);
                document.getElementById('repeatUntilDeleted').checked = !!note.repeatUntilDeleted;
                toggleRepeatInterval();
                document.getElementById('repeatDays').value = note.repeatDays || 0;
                document.getElementById('repeatHours').value = note.repeatHours || 0;
                document.getElementById('reminderText').value = note.text || '';
            }

            document.getElementById('formTitle').textContent = 'Edit Note';
            document.querySelector('.note-form').scrollIntoView({ behavior: 'smooth' });
        }

        async function deleteNote(id) {
            if (!confirm('Are you sure you want to delete this note?')) return;

            try {
                const response = await fetch(`${NOTES_URL}/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });

                if (response.ok) {
                    showMessage('Note deleted successfully', 'success');
                    loadNotes();
                } else {
                    showMessage('Failed to delete note', 'error');
                }
            } catch (error) {
                showMessage('Cannot connect to server', 'error');
            }
        }

        function clearForm() {
            document.getElementById('noteId').value = '';
            document.getElementById('noteType').value = '';
            document.getElementById('noteFrequency').value = 'never';
            document.getElementById('memoText').value = '';
            setDefaultReminderDateTime();
            document.getElementById('repeatUntilDeleted').checked = false;
            document.getElementById('repeatDays').value = 0;
            document.getElementById('repeatHours').value = 0;
            document.getElementById('reminderText').value = '';
            document.getElementById('repeatInterval').classList.remove('visible');
            document.getElementById('memoFields').classList.remove('visible');
            document.getElementById('reminderFields').classList.remove('visible');
            document.getElementById('formButtons').style.display = 'none';
            document.querySelectorAll('.type-tile').forEach(t => t.classList.remove('active-memo', 'active-reminder'));
            document.getElementById('formTitle').textContent = 'Add New Note';
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
