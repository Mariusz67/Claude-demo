<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Demo App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            padding: 12px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
        }

        .error-message {
            background: #fab1a0;
            color: #d63031;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .info-message {
            background: #dfe6e9;
            color: #2d3436;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .success-message {
            background: #b2f5c8;
            color: #1a7a3c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .toggle-link a {
            color: #6c63ff;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 id="formTitle">Login</h1>
        <p class="subtitle">Demo User Management System</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-login">Login</button>

            <div class="toggle-link">
                <a onclick="showForgotPassword()">Forgot password?</a>
            </div>
            <div class="toggle-link">
                No account? <a onclick="showRegister()">Register here</a>
            </div>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgotForm" onsubmit="handleForgotPassword(event)" style="display:none">
            <div class="form-group">
                <label for="forgotEmail">Email Address</label>
                <input
                    type="email"
                    id="forgotEmail"
                    name="forgotEmail"
                    required
                    placeholder="Enter your email"
                    autocomplete="email"
                >
            </div>

            <button type="submit" class="btn btn-login">Send Reset Link</button>

            <div class="toggle-link">
                <a onclick="showLogin()">Back to Login</a>
            </div>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <input
                    type="text"
                    id="regName"
                    name="regName"
                    required
                    placeholder="Enter your name"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <input
                    type="email"
                    id="regEmail"
                    name="regEmail"
                    required
                    placeholder="Enter your email"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <input
                    type="password"
                    id="regPassword"
                    name="regPassword"
                    required
                    minlength="8"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="regPasswordConfirm">Confirm Password</label>
                <input
                    type="password"
                    id="regPasswordConfirm"
                    name="regPasswordConfirm"
                    required
                    placeholder="Repeat your password"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="btn btn-login">Create Account</button>

            <div class="toggle-link">
                Already have an account? <a onclick="showLogin()">Login here</a>
            </div>
        </form>
    </div>

    <script>
        // Configuration - works both locally and on Railway
        const BASE_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:8081'
            : 'https://pretty-illumination-production.up.railway.app';

        const LOGIN_URL = BASE_URL + '/api/users/login';
        const REGISTER_URL = BASE_URL + '/api/users/register';
        const FORGOT_URL = BASE_URL + '/api/users/forgot-password';

        function hideAllForms() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'none';
            clearMessages();
        }

        function showRegister() {
            hideAllForms();
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('formTitle').textContent = 'Register';
        }

        function showLogin() {
            hideAllForms();
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('formTitle').textContent = 'Login';
        }

        function showForgotPassword() {
            hideAllForms();
            document.getElementById('forgotForm').style.display = 'block';
            document.getElementById('formTitle').textContent = 'Reset Password';
        }

        function clearMessages() {
            const err = document.getElementById('errorMessage');
            const suc = document.getElementById('successMessage');
            err.style.display = 'none';
            suc.style.display = 'none';
        }

        async function handleRegister(event) {
            event.preventDefault();
            const form = document.getElementById('registerForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;

            clearMessages();

            if (password !== confirm) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.style.display = 'block';
                return;
            }

            form.classList.add('loading');

            try {
                const response = await fetch(REGISTER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successMessage.textContent = 'Account created! You can now log in.';
                    successMessage.style.display = 'block';
                    form.reset();
                    setTimeout(showLogin, 1500);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed. Please try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Register error:', error);
                errorMessage.textContent = 'Cannot connect to server. Please try again later.';
                errorMessage.style.display = 'block';
            } finally {
                form.classList.remove('loading');
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const form = document.getElementById('forgotForm');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const email = document.getElementById('forgotEmail').value;

            clearMessages();
            form.classList.add('loading');

            try {
                const response = await fetch(FORGOT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                successMessage.textContent = data.message || 'If an account with that email exists, a reset link has been sent.';
                successMessage.style.display = 'block';
                form.reset();
            } catch (error) {
                errorMessage.textContent = 'Cannot connect to server. Please try again later.';
                errorMessage.style.display = 'block';
            } finally {
                form.classList.remove('loading');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const form = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Hide previous error messages
            errorMessage.style.display = 'none';

            // Add loading state
            form.classList.add('loading');

            try {
                const response = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store login info
                    sessionStorage.setItem('loggedIn', 'true');
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('userEmail', email);
                    sessionStorage.setItem('userRole', data.role);
                    sessionStorage.setItem('userName', data.user.name);
                    sessionStorage.setItem('encKeyData', JSON.stringify({ password, email }));

                    // Redirect based on role
                    if (data.role === 'admin') {
                        window.location.href = 'dashboard.html';
                    } else {
                        window.location.href = 'user.html';
                    }
                } else {
                    // Login failed
                    errorMessage.textContent = data.message || 'Invalid email or password';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Cannot connect to server. Please try again later.';
                errorMessage.style.display = 'block';
            } finally {
                // Remove loading state
                form.classList.remove('loading');
            }
        }

        // Check if already logged in
        if (sessionStorage.getItem('loggedIn')) {
            const role = sessionStorage.getItem('userRole');
            if (role === 'admin') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'user.html';
            }
        }
    </script>
</body>
</html>
